{% extends "base.html" %}{% block content %}<div class="hero"><div><h1>Create Appointment</h1><p>Front-desk scheduling with shared-groom attribution.</p></div></div><form method="post" class="card formgrid"><label class="full">Customer / Dog<select name="dog_id" required>{% for d in dogs %}<option value="{{d.id}}">{{d.customer_name}} — {{d.dog_name}} ({{d.breed}})</option>{% endfor %}</select></label><label>Service<select name="service"><option>Full-Service Groom</option><option>Full-Service Bath</option><option>Nail Service</option><option>Self-Wash Assistance</option></select></label><label>Date<input type="date" name="appointment_date" value="{{today}}" required></label><label>Start<input type="time" name="start_time" value="08:00" required></label><label>End<input type="time" name="end_time" value="10:00" required></label><label>Primary Groomer<select name="groomer">{% for g in groomers %}<option>{{g}}</option>{% endfor %}</select></label><label>Secondary Groomer<select name="secondary_groomer"><option value="">None</option>{% for g in groomers %}<option>{{g}}</option>{% endfor %}</select></label><label>Primary Revenue/Tip Split %<input type="number" name="primary_split" value="100" min="0" max="100" step="1"></label><label class="full">Notes<textarea name="notes"></textarea></label><button class="primary full">Create Appointment</button></form>{% endblock %}
