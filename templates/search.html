{% extends "base.html" %}{% block content %}<div class="hero"><div><h1>Search Results</h1><p>Results for “{{q}}”</p></div></div><div class="card">{% for r in rows %}<div class="row"><div><b>{{r.customer_name}} · {{r.dog_name}}</b><small>{{r.breed}} · {{r.phone}} · {{r.email}}</small></div><a class="button secondary" href="{{url_for('new_appointment')}}">Book</a></div>{% else %}<p class="muted">No matching customers or dogs.</p>{% endfor %}</div>{% endblock %}
